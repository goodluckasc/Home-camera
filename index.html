<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="হোম ক্যামেরা">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>হোম ক্যামেরা</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, 'Noto Sans Bengali', sans-serif;
      background: #000;
      color: #f5f5f7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      user-select: none;
    }
    .logo {
      width: 96px; height: 96px; border-radius: 24px;
      box-shadow: 0 8px 40px rgba(59, 130, 246, 0.35);
    }
    h1 { font-size: 30px; font-weight: 700; letter-spacing: 0.2px; }
    .sub { color: #8e8e93; font-size: 15px; margin-top: -18px; }
    .cards { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 14px; }
    .card {
      display: flex; align-items: center; gap: 16px;
      padding: 20px; border-radius: 22px; text-decoration: none; color: #f5f5f7;
      background: #111114; border: 1px solid #222228;
      transition: transform 0.12s, background 0.12s;
    }
    .card:active { transform: scale(0.97); background: #1a1a1f; }
    .ico {
      width: 56px; height: 56px; border-radius: 16px; flex: none;
      display: flex; align-items: center; justify-content: center; font-size: 28px;
    }
    .cam .ico { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
    .view .ico { background: linear-gradient(135deg, #22c55e, #15803d); }
    .card b { display: block; font-size: 19px; margin-bottom: 3px; }
    .card span { color: #8e8e93; font-size: 14px; line-height: 1.4; }
    #install {
      display: none; border: 0; border-radius: 14px; padding: 13px 22px;
      background: #1c1c22; color: #60a5fa; font-size: 16px; font-weight: 600;
    }
    #hint { color: #636366; font-size: 13px; text-align: center; max-width: 320px; line-height: 1.5; }
  </style>
</head>
<body>
  <img class="logo" src="icon.svg" alt="">
  <h1>হোম ক্যামেরা</h1>
  <div class="sub">আপনার বাসা, আপনার চোখের সামনে</div>

  <div class="cards">
    <a class="card cam" href="camera.html">
      <div class="ico">📷</div>
      <div><b>ক্যামেরা</b><span>এই ফোন বারান্দায় রেখে স্ট্রিম করো</span></div>
    </a>
    <a class="card view" href="viewer.html">
      <div class="ico">👁️</div>
      <div><b>ভিউয়ার</b><span>যেকোনো জায়গা থেকে লাইভ দেখো</span></div>
    </a>
  </div>

  <button id="install">⬇️ অ্যাপ ইনস্টল করো</button>
  <div id="hint"></div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    let deferred = null;
    const btn = document.getElementById('install');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferred = e;
      btn.style.display = 'block';
    });
    btn.onclick = async () => {
      if (!deferred) return;
      deferred.prompt();
      await deferred.userChoice;
      deferred = null;
      btn.style.display = 'none';
    };
    window.addEventListener('appinstalled', () => { btn.style.display = 'none'; });

    // আইফোনে ইনস্টল বাটন আসে না, তাই সেখানে নিয়ম দেখানো হয়
    const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    if (isIos && !standalone) {
      document.getElementById('hint').textContent =
        'অ্যাপ হিসেবে রাখতে Safari-র শেয়ার বাটনে চেপে "Add to Home Screen" বেছে নাও';
    }
  </script>
</body>
</html>
