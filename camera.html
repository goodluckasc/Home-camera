<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ক্যামেরা</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 16px;
    }
    video { width: 100%; max-width: 500px; border-radius: 12px; background: #000; }
    input {
      width: 100%; max-width: 500px; padding: 14px; font-size: 18px;
      border-radius: 10px; border: none; text-align: center;
    }
    button {
      width: 100%; max-width: 500px; padding: 14px; font-size: 18px;
      font-weight: 600; border: none; border-radius: 10px;
      background: #2563eb; color: white;
    }
    #status { color: #fbbf24; text-align: center; }
    .row { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 10px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <h2>📷 ক্যামেরা মোড</h2>

  <div class="row" id="setup">
    <input id="code" type="password" autocomplete="off" placeholder="গোপন কোড দাও">
    <button id="start">ক্যামেরা চালু করো</button>
  </div>

  <video id="preview" autoplay muted playsinline></video>
  <div id="status">কোড লিখে বাটনে চাপো</div>

  <script>
    const statusEl = document.getElementById('status');
    const preview = document.getElementById('preview');
    const setup = document.getElementById('setup');
    let stream, peer, wakeLock;
    let viewerConns = [];

    const iceServers = [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' }
      // মোবাইল ডেটায় কানেক্ট না হলে এখানে TURN সার্ভার যোগ করবে
    ];

    // ---------- মোশন ডিটেকশন ----------
    // ভিউয়ার থেকে সেনসিটিভিটি আসবে (১ = কম সংবেদনশীল, ১০০ = খুব সংবেদনশীল)
    let sensitivity = 50;
    let motionOn = true;
    let lastAlert = 0;
    let prevFrame = null;
    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 48;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    function sendToViewers(msg) {
      viewerConns.forEach(c => { if (c.open) c.send(msg); });
    }

    function checkMotion() {
      if (!stream || !motionOn || preview.readyState < 2) return;
      ctx.drawImage(preview, 0, 0, canvas.width, canvas.height);
      const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

      if (prevFrame) {
        let changed = 0;
        const pixels = data.length / 4;
        // সেনসিটিভিটি যত বেশি, পিক্সেল পার্থক্যের সীমা তত কম
        const pixelThreshold = 60 - sensitivity * 0.5;
        for (let i = 0; i < data.length; i += 4) {
          const diff =
            Math.abs(data[i] - prevFrame[i]) +
            Math.abs(data[i + 1] - prevFrame[i + 1]) +
            Math.abs(data[i + 2] - prevFrame[i + 2]);
          if (diff / 3 > pixelThreshold) changed++;
        }
        const percent = (changed / pixels) * 100;
        // কতটুকু অংশ বদলালে অ্যালার্ট হবে
        const areaThreshold = 12 - sensitivity * 0.1;

        if (percent > areaThreshold && Date.now() - lastAlert > 3000) {
          lastAlert = Date.now();
          sendToViewers({ type: 'motion', time: Date.now(), percent: Math.round(percent) });
        }
      }
      prevFrame = new Uint8ClampedArray(data);
    }
    setInterval(checkMotion, 500);

    // ---------- স্ক্রিন জাগিয়ে রাখা ----------
    async function keepAwake() {
      try { wakeLock = await navigator.wakeLock.request('screen'); }
      catch (e) { console.log('wakeLock নেই', e); }
    }

    // ---------- ক্যামেরা চালু ----------
    document.getElementById('start').onclick = async () => {
      const input = document.getElementById('code');
      const code = input.value.trim();
      if (code.length < 6) {
        statusEl.textContent = 'কোড অন্তত ৬ অক্ষরের দাও';
        return;
      }

      // কোড নেওয়ার সাথে সাথেই ইনপুট আর বাটন লুকিয়ে ফেলো
      input.value = '';
      setup.classList.add('hidden');

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: 1280, height: 720 },
          audio: false
        });
      } catch (err) {
        statusEl.textContent = 'ক্যামেরা পারমিশন পাওয়া যায়নি: ' + err.message;
        setup.classList.remove('hidden');
        return;
      }

      preview.srcObject = stream;
      keepAwake();

      peer = new Peer('homecam-' + code, { config: { iceServers } });

      peer.on('open', () => {
        statusEl.textContent = '✅ ক্যামেরা চালু। ভিউয়ারের জন্য অপেক্ষা করছে...';
      });

      // ভিউয়ারের সাথে ডেটা চ্যানেল (সেনসিটিভিটি আসবে, মোশন সংকেত যাবে)
      peer.on('connection', (conn) => {
        viewerConns.push(conn);
        conn.on('data', (msg) => {
          if (msg.type === 'sensitivity') sensitivity = Number(msg.value);
          if (msg.type === 'motionOn') motionOn = !!msg.value;
        });
        conn.on('close', () => {
          viewerConns = viewerConns.filter(c => c !== conn);
        });
      });

      peer.on('call', (call) => {
        call.answer(stream);
        statusEl.textContent = '🔴 কেউ লাইভ দেখছে';
        call.on('close', () => {
          statusEl.textContent = '✅ ক্যামেরা চালু। ভিউয়ারের জন্য অপেক্ষা করছে...';
        });
      });

      peer.on('disconnected', () => peer.reconnect());

      peer.on('error', (err) => {
        statusEl.textContent = 'সমস্যা: ' + err.type;
        if (err.type === 'unavailable-id') {
          statusEl.textContent = 'এই কোড আগে থেকেই ব্যবহার হচ্ছে, পেজ রিফ্রেশ করে নতুন কোড দাও';
          setup.classList.remove('hidden');
        }
      });
    };

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && stream) keepAwake();
    });
  </script>
</body>
</html>
