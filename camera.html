<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>ক্যামেরা</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: system-ui, -apple-system, 'Noto Sans Bengali', sans-serif;
      background: #000;
      color: #f5f5f7;
      user-select: none;
    }
    #preview { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }

    /* ওপরের স্ট্যাটাস বার */
    #topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 5;
      padding: max(14px, env(safe-area-inset-top)) 16px 28px;
      background: linear-gradient(#000000cc, transparent);
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    #status { font-size: 15px; font-weight: 600; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600;
      background: #ffffff1f; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #8e8e93; }
    .live .dot { background: #ef4444; animation: pulse 1.2s infinite; }
    @keyframes pulse { 50% { opacity: 0.25; } }

    /* নিচের বার */
    #bottombar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 5;
      padding: 28px 16px max(18px, env(safe-area-inset-bottom));
      background: linear-gradient(transparent, #000000cc);
      display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;
    }
    #driveStatus { font-size: 13px; color: #d1d1d6; }
    #driveStatus.warn { color: #fca5a5; }

    /* সেটআপ কার্ড */
    #setup {
      position: fixed; inset: 0; z-index: 10; background: #000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; padding: 24px;
      transition: opacity 0.35s;
    }
    #setup.gone { opacity: 0; pointer-events: none; }
    #setup img { width: 76px; height: 76px; border-radius: 20px; box-shadow: 0 8px 40px #3b82f659; }
    #setup h2 { font-size: 24px; }
    .field {
      width: 100%; max-width: 360px; padding: 16px; font-size: 18px; text-align: center;
      border-radius: 16px; border: 1px solid #2c2c34; background: #111114; color: #fff; outline: none;
    }
    .field:focus { border-color: #3b82f6; }
    .btn {
      width: 100%; max-width: 360px; padding: 16px; font-size: 17px; font-weight: 700;
      border: 0; border-radius: 16px; color: #fff; background: #2563eb;
    }
    .btn:active { transform: scale(0.97); }
    .btn.ghost { background: #1c1c22; color: #60a5fa; }
    .btn.ghost.ok { color: #4ade80; }
    #setupMsg { color: #fbbf24; font-size: 14px; min-height: 20px; text-align: center; }

    /* স্ক্রিন বন্ধ মোড */
    #dim {
      position: fixed; inset: 0; z-index: 20; background: #000; display: none;
      align-items: center; justify-content: center; color: #2c2c34; font-size: 14px;
    }
    #dim.on { display: flex; }
  </style>
</head>
<body>
  <video id="preview" autoplay muted playsinline></video>

  <div id="topbar">
    <div id="status">ক্যামেরা বন্ধ</div>
    <div class="pill" id="livePill"><span class="dot"></span><span id="liveTxt">অফলাইন</span></div>
  </div>

  <div id="bottombar">
    <div id="driveStatus">☁️ ড্রাইভ: সংযুক্ত নয়</div>
    <button class="pill" id="dimBtn" style="border:0;color:#fff">🌙 স্ক্রিন কালো করো</button>
  </div>

  <div id="setup">
    <img src="icon.svg" alt="">
    <h2>ক্যামেরা মোড</h2>
    <input id="code" class="field" type="password" autocomplete="off" placeholder="গোপন কোড দাও">
    <button id="driveBtn" class="btn ghost">☁️ গুগল ড্রাইভ সংযোগ করো</button>
    <button id="start" class="btn">ক্যামেরা চালু করো</button>
    <div id="setupMsg"></div>
  </div>

  <div id="dim">স্ক্রিনে ট্যাপ করলে ফিরে আসবে</div>

  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

    // ================= সেটিংস =================
    const CLIENT_ID = '5086911283-ngrpb3acvettopls7bn55lpfco5t2ldo.apps.googleusercontent.com';
    const SCOPE = 'https://www.googleapis.com/auth/drive.file';
    const FOLDER_NAME = 'HomeCamera';
    const KEEP_DAYS = 3;
    const SEGMENT_MS = 8000;
    const AFTER_MOTION_MS = 15000;
    const MAX_QUEUE = 20;

    const statusEl = document.getElementById('status');
    const driveStatusEl = document.getElementById('driveStatus');
    const preview = document.getElementById('preview');
    const setup = document.getElementById('setup');
    const setupMsg = document.getElementById('setupMsg');
    const driveBtn = document.getElementById('driveBtn');
    const livePill = document.getElementById('livePill');
    const liveTxt = document.getElementById('liveTxt');
    const dim = document.getElementById('dim');
    let stream, peer, wakeLock;
    let viewerConns = [];

    const iceServers = [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' }
      // মোবাইল ডেটায় কানেক্ট না হলে এখানে TURN সার্ভার যোগ করবে
    ];

    function driveStatus(msg, warn) {
      driveStatusEl.textContent = msg;
      driveStatusEl.className = warn ? 'warn' : '';
    }
    function setLive(on, txt) {
      livePill.classList.toggle('live', on);
      liveTxt.textContent = txt;
    }

    // ================= গুগল ড্রাইভ =================
    let tokenClient = null;
    let accessToken = null;
    let tokenExpiry = 0;
    let folderId = null;
    let lastCleanup = 0;
    let uploadQueue = [];
    let uploading = false;

    function makeTokenClient() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPE,
        callback: (resp) => {
          if (resp.error) {
            driveStatus('ড্রাইভ সংযোগ ব্যর্থ: ' + resp.error, true);
            setupMsg.textContent = 'ড্রাইভ সংযোগ ব্যর্থ: ' + resp.error;
            return;
          }
          accessToken = resp.access_token;
          tokenExpiry = Date.now() + (Number(resp.expires_in) - 120) * 1000;
          driveBtn.textContent = '✅ ড্রাইভ সংযুক্ত';
          driveBtn.classList.add('ok');
          setupMsg.textContent = '';
          driveStatus('☁️ ড্রাইভ সংযুক্ত');
          processQueue();
        },
        error_callback: () => {
          driveStatus('ড্রাইভ সংযোগ দরকার, সেটআপে গিয়ে আবার চাপো', true);
        }
      });
    }

    driveBtn.onclick = () => {
      if (!window.google || !google.accounts) {
        setupMsg.textContent = 'গুগল লাইব্রেরি লোড হয়নি, একটু পরে আবার চাপো';
        return;
      }
      if (!tokenClient) makeTokenClient();
      tokenClient.requestAccessToken({ prompt: '' });
    };

    async function driveFetch(url, opts) {
      opts = opts || {};
      const headers = Object.assign({}, opts.headers || {}, { Authorization: 'Bearer ' + accessToken });
      const r = await fetch(url, Object.assign({}, opts, { headers }));
      if (r.status === 401) {
        accessToken = null;
        throw new Error('টোকেনের মেয়াদ শেষ');
      }
      if (!r.ok) throw new Error('Drive ' + r.status);
      return r;
    }

    async function getFolder() {
      const q = encodeURIComponent("name='" + FOLDER_NAME + "' and mimeType='application/vnd.google-apps.folder' and trashed=false");
      let r = await driveFetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id)');
      let j = await r.json();
      if (j.files && j.files.length) return j.files[0].id;
      r = await driveFetch('https://www.googleapis.com/drive/v3/files', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' })
      });
      j = await r.json();
      return j.id;
    }

    async function uploadFile(item) {
      const meta = { name: item.name, parents: [folderId] };
      const form = new FormData();
      form.append('metadata', new Blob([JSON.stringify(meta)], { type: 'application/json' }));
      form.append('file', item.blob);
      await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method: 'POST',
        body: form
      });
    }

    async function cleanupOld() {
      if (Date.now() - lastCleanup < 3600000) return;
      lastCleanup = Date.now();
      try {
        const cutoff = new Date(Date.now() - KEEP_DAYS * 86400000).toISOString();
        const q = encodeURIComponent("'" + folderId + "' in parents and createdTime < '" + cutoff + "' and trashed=false");
        const r = await driveFetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id)&pageSize=100');
        const j = await r.json();
        for (const f of (j.files || [])) {
          await driveFetch('https://www.googleapis.com/drive/v3/files/' + f.id, { method: 'DELETE' });
        }
      } catch (e) {
        console.log('পুরনো ফাইল মোছা যায়নি', e);
      }
    }

    async function processQueue() {
      if (uploading || !uploadQueue.length) return;
      if (!accessToken || Date.now() > tokenExpiry) {
        if (tokenClient) tokenClient.requestAccessToken({ prompt: '' });
        return;
      }
      uploading = true;
      try {
        if (!folderId) folderId = await getFolder();
        while (uploadQueue.length) {
          await uploadFile(uploadQueue[0]);
          uploadQueue.shift();
          driveStatus('☁️ ক্লিপ আপলোড হয়েছে (' + new Date().toLocaleTimeString('bn-BD') + ')');
        }
        cleanupOld();
      } catch (e) {
        driveStatus('আপলোড সমস্যা: ' + e.message, true);
      }
      uploading = false;
    }
    setInterval(processQueue, 30000);

    function enqueue(seg) {
      if (!tokenClient) return;
      const stamp = new Date(seg.time).toISOString().replace(/[:.]/g, '-');
      uploadQueue.push({ name: 'clip-' + stamp + '.' + recExt, blob: seg.blob });
      while (uploadQueue.length > MAX_QUEUE) uploadQueue.shift();
      processQueue();
    }

    // ================= ইভেন্ট রেকর্ডিং =================
    const recMime = ['video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4']
      .find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
    const recExt = recMime && recMime.indexOf('mp4') !== -1 ? 'mp4' : 'webm';
    let recording = false;
    let prevSeg = null;
    let curMotion = false;
    let keepUntil = 0;

    function startSegments() {
      if (!recMime) {
        driveStatus('এই ব্রাউজারে ভিডিও রেকর্ডিং সাপোর্ট নেই', true);
        return;
      }
      recording = true;
      runSegment();
    }

    function runSegment() {
      if (!recording || !stream) return;
      const chunks = [];
      const startTime = Date.now();
      const rec = new MediaRecorder(stream, { mimeType: recMime, videoBitsPerSecond: 600000, audioBitsPerSecond: 64000 });
      rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
      rec.onstop = () => {
        onSegmentEnd(new Blob(chunks, { type: recMime }), startTime);
        runSegment();
      };
      rec.start();
      setTimeout(() => { if (rec.state === 'recording') rec.stop(); }, SEGMENT_MS);
    }

    function onSegmentEnd(blob, startTime) {
      const seg = { blob: blob, time: startTime, saved: false };
      const shouldSave = curMotion || Date.now() < keepUntil;
      if (shouldSave) {
        if (prevSeg && !prevSeg.saved) { enqueue(prevSeg); prevSeg.saved = true; }
        enqueue(seg);
        seg.saved = true;
      }
      prevSeg = seg;
      curMotion = false;
    }

    // ================= মোশন ডিটেকশন =================
    let sensitivity = 50;
    let motionOn = true;
    let lastAlert = 0;
    let prevFrame = null;
    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 48;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    function sendToViewers(msg) {
      viewerConns.forEach(c => { if (c.open) c.send(msg); });
    }

    function checkMotion() {
      if (!stream || !motionOn || preview.readyState < 2) return;
      ctx.drawImage(preview, 0, 0, canvas.width, canvas.height);
      const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

      if (prevFrame) {
        let changed = 0;
        const pixels = data.length / 4;
        const pixelThreshold = 60 - sensitivity * 0.5;
        for (let i = 0; i < data.length; i += 4) {
          const diff =
            Math.abs(data[i] - prevFrame[i]) +
            Math.abs(data[i + 1] - prevFrame[i + 1]) +
            Math.abs(data[i + 2] - prevFrame[i + 2]);
          if (diff / 3 > pixelThreshold) changed++;
        }
        const percent = (changed / pixels) * 100;
        const areaThreshold = 12 - sensitivity * 0.1;

        if (percent > areaThreshold) {
          curMotion = true;
          keepUntil = Date.now() + AFTER_MOTION_MS;
          if (Date.now() - lastAlert > 3000) {
            lastAlert = Date.now();
            sendToViewers({ type: 'motion', time: Date.now(), percent: Math.round(percent) });
          }
        }
      }
      prevFrame = new Uint8ClampedArray(data);
    }
    setInterval(checkMotion, 500);

    // ================= স্ক্রিন জাগিয়ে রাখা + কালো মোড =================
    async function keepAwake() {
      try { wakeLock = await navigator.wakeLock.request('screen'); }
      catch (e) { console.log('wakeLock নেই', e); }
    }
    document.getElementById('dimBtn').onclick = () => dim.classList.add('on');
    dim.onclick = () => dim.classList.remove('on');

    // ================= ক্যামেরা চালু =================
    document.getElementById('start').onclick = async () => {
      const input = document.getElementById('code');
      const code = input.value.trim();
      if (code.length < 6) {
        setupMsg.textContent = 'কোড অন্তত ৬ অক্ষরের দাও';
        return;
      }
      setupMsg.textContent = '';

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: 1280, height: 720 },
          audio: { echoCancellation: true, noiseSuppression: true }
        });
      } catch (err) {
        setupMsg.textContent = 'ক্যামেরা বা মাইক্রোফোনের অনুমতি পাওয়া যায়নি: ' + err.message;
        return;
      }

      // কোড নেওয়ার সাথে সাথেই ইনপুট মুছে সেটআপ কার্ড লুকিয়ে ফেলো
      input.value = '';
      setup.classList.add('gone');

      preview.srcObject = stream;
      statusEl.textContent = 'সংযোগ হচ্ছে...';
      setLive(false, 'সংযোগ হচ্ছে');
      keepAwake();
      startSegments();

      peer = new Peer('homecam-' + code, { config: { iceServers } });

      peer.on('open', () => {
        statusEl.textContent = 'ক্যামেরা চালু';
        setLive(false, 'অপেক্ষা করছে');
      });

      peer.on('connection', (conn) => {
        viewerConns.push(conn);
        conn.on('data', (msg) => {
          if (msg.type === 'sensitivity') sensitivity = Number(msg.value);
          if (msg.type === 'motionOn') motionOn = !!msg.value;
        });
        conn.on('close', () => {
          viewerConns = viewerConns.filter(c => c !== conn);
        });
      });

      peer.on('call', (call) => {
        call.answer(stream);
        statusEl.textContent = 'কেউ দেখছে';
        setLive(true, 'লাইভ');
        call.on('close', () => {
          statusEl.textContent = 'ক্যামেরা চালু';
          setLive(false, 'অপেক্ষা করছে');
        });
      });

      peer.on('disconnected', () => peer.reconnect());

      peer.on('error', (err) => {
        statusEl.textContent = 'সমস্যা: ' + err.type;
        if (err.type === 'unavailable-id') {
          statusEl.textContent = 'এই কোড আগে থেকেই ব্যবহার হচ্ছে, পেজ রিফ্রেশ করে নতুন কোড দাও';
        }
      });
    };

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && stream) keepAwake();
    });
  </script>
</body>
</html>
