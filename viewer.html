<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ভিউয়ার</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 16px;
    }
    video {
      width: 100%;
      max-width: 700px;
      border-radius: 12px;
      background: #000;
    }
    input {
      width: 100%;
      max-width: 500px;
      padding: 14px;
      font-size: 18px;
      border-radius: 10px;
      border: none;
      text-align: center;
    }
    button {
      width: 100%;
      max-width: 500px;
      padding: 14px;
      font-size: 18px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      background: #16a34a;
      color: white;
    }
    #status { color: #fbbf24; text-align: center; }
  </style>
</head>
<body>
  <h2>👀 ভিউয়ার মোড</h2>
  <input id="code" placeholder="ক্যামেরার সেই গোপন কোড দাও">
  <button id="connect">লাইভ দেখো</button>
  <video id="remote" autoplay playsinline controls></video>
  <div id="status">কোড লিখে বাটনে চাপো</div>

  <script>
    const statusEl = document.getElementById('status');
    const remote = document.getElementById('remote');
    let peer, currentCall;

    const iceServers = [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' }
      // মোবাইল ডেটায় কানেক্ট না হলে এখানে TURN সার্ভার যোগ করবে
    ];

    // PeerJS-এর call করতে একটা ভিডিও ট্র্যাক লাগে, তাই একটা ফাঁকা স্ট্রিম বানাই
    function dummyStream() {
      const canvas = document.createElement('canvas');
      canvas.width = 2; canvas.height = 2;
      canvas.getContext('2d').fillRect(0, 0, 2, 2);
      return canvas.captureStream(1);
    }

    document.getElementById('connect').onclick = () => {
      const code = document.getElementById('code').value.trim();
      if (code.length < 6) {
        statusEl.textContent = 'কোড অন্তত ৬ অক্ষরের দাও';
        return;
      }

      if (peer) peer.destroy();
      statusEl.textContent = 'কানেক্ট হচ্ছে...';

      peer = new Peer({ config: { iceServers } });

      peer.on('open', () => {
        currentCall = peer.call('homecam-' + code, dummyStream());

        currentCall.on('stream', (stream) => {
          remote.srcObject = stream;
          remote.play().catch(() => {});
          statusEl.textContent = '🔴 লাইভ চলছে';
        });

        currentCall.on('close', () => {
          statusEl.textContent = 'কানেকশন বন্ধ হয়ে গেছে';
        });

        currentCall.on('error', (e) => {
          statusEl.textContent = 'কল সমস্যা: ' + e;
        });
      });

      peer.on('error', (err) => {
        if (err.type === 'peer-unavailable') {
          statusEl.textContent = 'ক্যামেরা অনলাইনে নেই বা কোড ভুল';
        } else {
          statusEl.textContent = 'সমস্যা: ' + err.type;
        }
      });
    };
  </script>
</body>
</html>
