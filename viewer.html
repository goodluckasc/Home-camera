<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ভিউয়ার</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 16px;
      transition: background 0.2s;
    }
    body.alarm { background: #7f1d1d; }
    video { width: 100%; max-width: 700px; border-radius: 12px; background: #000; }
    input[type=password] {
      width: 100%; max-width: 500px; padding: 14px; font-size: 18px;
      border-radius: 10px; border: none; text-align: center;
    }
    button {
      width: 100%; max-width: 500px; padding: 14px; font-size: 18px;
      font-weight: 600; border: none; border-radius: 10px;
      background: #16a34a; color: white;
    }
    #status { color: #fbbf24; text-align: center; }
    .videoWrap { position: relative; width: 100%; max-width: 700px; }
    .videoWrap video { width: 100%; }
    #speaker {
      position: absolute; right: 10px; bottom: 10px;
      width: 52px; height: 52px; padding: 0; font-size: 26px;
      border-radius: 50%; background: rgba(0,0,0,0.6); color: white;
    }
    .row { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 10px; }
    .hidden { display: none !important; }
    #controls {
      width: 100%; max-width: 500px; background: #1e293b;
      padding: 14px; border-radius: 12px; display: flex; flex-direction: column; gap: 10px;
    }
    #controls label { display: flex; justify-content: space-between; }
    input[type=range] { width: 100%; }
    #alert {
      width: 100%; max-width: 500px; padding: 14px; border-radius: 12px;
      background: #dc2626; color: white; font-size: 20px; font-weight: 700;
      text-align: center;
    }
    #alert button { background: white; color: #dc2626; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>👀 ভিউয়ার মোড</h2>

  <div class="row" id="setup">
    <input id="code" type="password" autocomplete="off" placeholder="ক্যামেরার গোপন কোড দাও">
    <button id="connect">লাইভ দেখো</button>
  </div>

  <div id="alert" class="hidden">
    ⚠️ নড়াচড়া ধরা পড়েছে!
    <div id="alertTime" style="font-size:14px;font-weight:400"></div>
    <button id="stopAlarm">অ্যালার্ম বন্ধ করো</button>
  </div>

  <div class="videoWrap">
    <video id="remote" autoplay muted playsinline></video>
    <button id="speaker" title="শব্দ চালু/বন্ধ">🔇</button>
  </div>
  <div id="status">কোড লিখে বাটনে চাপো</div>

  <div id="controls" class="hidden">
    <label>
      <span>মোশন সেনসিটিভিটি</span>
      <span id="sensVal">50</span>
    </label>
    <input id="sens" type="range" min="1" max="100" value="50">
    <label>
      <span>মোশন অ্যালার্ট চালু</span>
      <input id="motionToggle" type="checkbox" checked>
    </label>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const remote = document.getElementById('remote');
    const setup = document.getElementById('setup');
    const controls = document.getElementById('controls');
    const alertBox = document.getElementById('alert');
    let peer, currentCall, dataConn, audioCtx, alarmTimer;

    const iceServers = [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' }
      // মোবাইল ডেটায় কানেক্ট না হলে এখানে TURN সার্ভার যোগ করবে
    ];

    function dummyStream() {
      const c = document.createElement('canvas');
      c.width = 2; c.height = 2;
      c.getContext('2d').fillRect(0, 0, 2, 2);
      return c.captureStream(1);
    }

    // ---------- বিপ শব্দ ----------
    function beep(freq = 880, duration = 0.18) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = freq;
      gain.gain.value = 0.25;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function startAlarm() {
      alertBox.classList.remove('hidden');
      document.body.classList.add('alarm');
      document.getElementById('alertTime').textContent =
        new Date().toLocaleTimeString('bn-BD');

      if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]);

      clearInterval(alarmTimer);
      let n = 0;
      // বিপ বিপ বিপ, প্রতি ১ সেকেন্ডে তিনবার করে
      alarmTimer = setInterval(() => {
        beep(n % 2 === 0 ? 880 : 660);
        n++;
        if (n >= 6) clearInterval(alarmTimer);
      }, 220);

      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification('⚠️ নড়াচড়া ধরা পড়েছে', { body: 'ক্যামেরার সামনে কিছু নড়ছে' });
      }
    }

    function stopAlarm() {
      clearInterval(alarmTimer);
      alertBox.classList.add('hidden');
      document.body.classList.remove('alarm');
      if (navigator.vibrate) navigator.vibrate(0);
    }
    document.getElementById('stopAlarm').onclick = stopAlarm;

    // ---------- স্পিকার (শব্দ চালু/বন্ধ) ----------
    const speakerBtn = document.getElementById('speaker');
    speakerBtn.onclick = () => {
      remote.muted = !remote.muted;
      speakerBtn.textContent = remote.muted ? '🔇' : '🔊';
      remote.play().catch(() => {});
    };

    // ---------- স্লাইডার ও টগল ----------
    const sens = document.getElementById('sens');
    sens.oninput = () => {
      document.getElementById('sensVal').textContent = sens.value;
      if (dataConn && dataConn.open) {
        dataConn.send({ type: 'sensitivity', value: Number(sens.value) });
      }
    };
    document.getElementById('motionToggle').onchange = (e) => {
      if (dataConn && dataConn.open) {
        dataConn.send({ type: 'motionOn', value: e.target.checked });
      }
    };

    // ---------- কানেক্ট ----------
    document.getElementById('connect').onclick = () => {
      const input = document.getElementById('code');
      const code = input.value.trim();
      if (code.length < 6) {
        statusEl.textContent = 'কোড অন্তত ৬ অক্ষরের দাও';
        return;
      }

      // বাটন চাপার সাথে সাথেই কোড মুছে ইনপুট লুকাও
      input.value = '';
      setup.classList.add('hidden');

      // বিপ বাজাতে ব্রাউজারে ইউজারের ট্যাপের ভেতরেই অডিও চালু করতে হয়
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }

      if (peer) peer.destroy();
      statusEl.textContent = 'কানেক্ট হচ্ছে...';

      peer = new Peer({ config: { iceServers } });

      peer.on('open', () => {
        const camId = 'homecam-' + code;

        // ডেটা চ্যানেল (মোশন সংকেত আসবে, সেনসিটিভিটি যাবে)
        dataConn = peer.connect(camId, { reliable: true });
        dataConn.on('open', () => {
          controls.classList.remove('hidden');
          dataConn.send({ type: 'sensitivity', value: Number(sens.value) });
        });
        dataConn.on('data', (msg) => {
          if (msg.type === 'motion') startAlarm();
        });

        // ভিডিও কল
        currentCall = peer.call(camId, dummyStream());

        currentCall.on('stream', (stream) => {
          remote.srcObject = stream;
          remote.play().catch(() => {});
          statusEl.textContent = '🔴 লাইভ চলছে';
        });

        currentCall.on('close', () => {
          statusEl.textContent = 'কানেকশন বন্ধ হয়ে গেছে';
          setup.classList.remove('hidden');
        });

        currentCall.on('error', (e) => {
          statusEl.textContent = 'কল সমস্যা: ' + e;
          setup.classList.remove('hidden');
        });
      });

      peer.on('error', (err) => {
        if (err.type === 'peer-unavailable') {
          statusEl.textContent = 'ক্যামেরা অনলাইনে নেই বা কোড ভুল';
        } else {
          statusEl.textContent = 'সমস্যা: ' + err.type;
        }
        setup.classList.remove('hidden');
      });
    };
  </script>
</body>
</html>
